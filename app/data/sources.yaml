# Source registry seed data.
#
# Every source carries a policy record. A connector cannot be scheduled unless
# its record is current (see app/registry.py: assert_runnable). Editing this file
# and running `python -m scripts.sync_registry` updates the database.
#
# robots_status: allowed | partial | disallowed | unknown | blocked
#   disallowed  -> we do not crawl it at all (e.g. robots.txt Disallow: /)
#   blocked     -> technically unreachable for us right now (captcha, NICNET-only)
# tier: A structured+open | B open but hostile | C licensed | D authenticated

sources:
  - key: gem_listing
    name: GeM — Bid Listings
    tier: A
    category: central_marketplace
    base_url: https://bidplus.gem.gov.in
    connector: gem_listing
    enabled: true
    auth_required: false
    robots_status: allowed
    terms_summary: >-
      Public bid listing pages, no login required. Automated collection kept to a
      low request rate with an identified user agent; no personal data of
      individual officers is collected from listing pages.
    permitted_paths: ["/all-bids-data", "/bidding/bid/getBidResultView/*", "/showbidDocument/*"]
    rate_limit_per_min: 12
    egress_region: IN
    licence_id: null
    redistribution_allowed: true
    policy_reviewed_at: 2026-11-01
    policy_reviewed_by: compliance-owner
    policy_note: Tier A primary source. Listing metadata only; documents archived for extraction.
    schedule_cron: "0 3 * * *"

  - key: gem_results
    name: GeM — Bid Results (price ladder)
    tier: A
    category: central_marketplace
    base_url: https://bidplus.gem.gov.in
    connector: gem_results
    enabled: true
    auth_required: false
    robots_status: allowed
    terms_summary: >-
      Bid result pages are published publicly with no login. They contain the
      technical evaluation list and the financial evaluation ranking (L1..Ln)
      with each seller's total price. Buyer name/email/phone are present but are
      classified as official-channel data and are not exposed by the API.
    permitted_paths: ["/bidding/bid/getBidResultView/*"]
    rate_limit_per_min: 10
    egress_region: IN
    licence_id: null
    redistribution_allowed: true
    policy_reviewed_at: 2026-11-01
    policy_reviewed_by: compliance-owner
    policy_note: >-
      Highest-value source in India for price intelligence. Individual officer
      names are stored as individual_identifying and are non-searchable.
    schedule_cron: "30 3 * * *"

  - key: gem_documents
    name: GeM — Bid Documents (PDF)
    tier: A
    category: central_marketplace
    base_url: https://bidplus.gem.gov.in
    connector: gem_documents
    enabled: true
    auth_required: false
    robots_status: allowed
    terms_summary: Bid document PDFs are linked publicly from each bid page.
    permitted_paths: ["/showbidDocument/*"]
    rate_limit_per_min: 8
    egress_region: IN
    licence_id: null
    redistribution_allowed: false
    policy_reviewed_at: 2026-11-01
    policy_reviewed_by: compliance-owner
    policy_note: >-
      Archived for extraction only. Documents are not re-served to customers;
      customers get extracted facts plus a link to the source.
    schedule_cron: null

  - key: cppp_listing
    name: CPPP / eprocure.gov.in — Tender Listings
    tier: B
    category: central
    base_url: https://eprocure.gov.in
    connector: cppp_listing
    enabled: false
    auth_required: false
    robots_status: blocked
    terms_summary: >-
      Active-tender listing moved to an encrypted app behind a captcha in late
      October 2026; the host has periods of answering only Indian, at times
      NICNET-only, addresses. No public API for third parties.
    permitted_paths: []
    rate_limit_per_min: 4
    egress_region: IN
    licence_id: null
    redistribution_allowed: true
    policy_reviewed_at: 2026-11-01
    policy_reviewed_by: compliance-owner
    policy_note: >-
      Best-effort only. Suspended pending a stable, captcha-free access path or a
      licensed feed. Must never be re-enabled without a fresh policy review.
    schedule_cron: null

  - key: cppp_aoc
    name: CPPP — Award of Contract
    tier: B
    category: central
    base_url: https://eprocure.gov.in
    connector: cppp_aoc
    enabled: false
    auth_required: false
    robots_status: blocked
    terms_summary: AOC detail pages are captcha-gated. Winner and contract value only; no L2/L3.
    permitted_paths: []
    rate_limit_per_min: 4
    egress_region: IN
    licence_id: null
    redistribution_allowed: true
    policy_reviewed_at: 2026-11-01
    policy_reviewed_by: compliance-owner
    policy_note: Captcha-gated. Do not solve captchas. Route via licensed feed or analyst queue.
    schedule_cron: null

  - key: etenders_gov
    name: eTenders.gov.in (GePNIC)
    tier: B
    category: central_multi_org
    base_url: https://etenders.gov.in
    connector: gepnic_generic
    enabled: false
    auth_required: false
    robots_status: partial
    terms_summary: >-
      GePNIC instance. Full tender detail pages carry EMD, estimated value,
      location and PIN. Session-bound links; resolve the stable lookup page.
    permitted_paths: ["/eprocure/app*"]
    rate_limit_per_min: 6
    egress_region: IN
    licence_id: null
    redistribution_allowed: true
    policy_reviewed_at: 2026-10-20
    policy_reviewed_by: compliance-owner
    policy_note: Phase 5 source. Connector template in app/connectors/gepnic.py is a stub.
    schedule_cron: null

  - key: ireps
    name: IREPS — Indian Railways
    tier: B
    category: railways
    base_url: https://www.ireps.gov.in
    connector: ireps
    enabled: false
    auth_required: false
    robots_status: partial
    terms_summary: >-
      Anonymous users can search and download live tender documents; fuller
      history and post-contract data require a vendor login, which we do not use.
    permitted_paths: ["/eps/home/*"]
    rate_limit_per_min: 6
    egress_region: IN
    licence_id: null
    redistribution_allowed: true
    policy_reviewed_at: 2026-10-20
    policy_reviewed_by: compliance-owner
    policy_note: Phase 5. Document-heavy extraction; high commercial value.
    schedule_cron: null

  - key: maharashtra
    name: Maharashtra e-Tenders
    tier: B
    category: state
    base_url: https://mahatenders.gov.in
    connector: null
    enabled: false
    auth_required: false
    robots_status: disallowed
    terms_summary: robots.txt disallows all paths. Excluded from collection.
    permitted_paths: []
    rate_limit_per_min: 0
    egress_region: IN
    licence_id: null
    redistribution_allowed: false
    policy_reviewed_at: 2026-10-20
    policy_reviewed_by: compliance-owner
    policy_note: >-
      EXCLUDED. Do not crawl. Revisit only if a licence is obtained or robots.txt
      changes. The registry is the gate: keep this row disallowed.
    schedule_cron: null

  - key: tn_tenders
    name: Tamil Nadu e-Tenders
    tier: B
    category: state
    base_url: https://tntenders.gov.in
    connector: gepnic_generic
    enabled: false
    auth_required: false
    robots_status: partial
    terms_summary: GePNIC instance; high volume; full detail records.
    permitted_paths: ["/eprocure/app*"]
    rate_limit_per_min: 6
    egress_region: IN
    licence_id: null
    redistribution_allowed: true
    policy_reviewed_at: 2026-10-20
    policy_reviewed_by: compliance-owner
    policy_note: Phase 5 priority state.
    schedule_cron: null

  - key: telangana_tenders
    name: Telangana e-Procurement
    tier: B
    category: state
    base_url: https://tender.telangana.gov.in
    connector: gepnic_generic
    enabled: false
    auth_required: false
    robots_status: partial
    terms_summary: Publishes value and location; relevant to HVAC and electrical categories.
    permitted_paths: []
    rate_limit_per_min: 6
    egress_region: IN
    licence_id: null
    redistribution_allowed: true
    policy_reviewed_at: 2026-10-20
    policy_reviewed_by: compliance-owner
    policy_note: Phase 5 priority state.
    schedule_cron: null

  - key: data_gov_in
    name: data.gov.in (OGD Platform)
    tier: A
    category: open_data
    base_url: https://api.data.gov.in
    connector: ogd
    enabled: false
    auth_required: true
    robots_status: allowed
    terms_summary: >-
      Free API key required. Released under the Government Open Data Licence
      (GODL), which permits commercial use with attribution.
    permitted_paths: ["/resource/*"]
    rate_limit_per_min: 30
    egress_region: IN
    licence_id: GODL-India
    redistribution_allowed: true
    policy_reviewed_at: 2026-10-15
    policy_reviewed_by: compliance-owner
    policy_note: Thin on tender-level records; useful for macro context and state datasets.
    schedule_cron: null

  - key: bidassist_api
    name: BidAssist Partner API (licensed)
    tier: C
    category: licensed
    base_url: https://partner-api.bidassist.in
    connector: bidassist
    enabled: false
    auth_required: true
    robots_status: allowed
    terms_summary: >-
      Documented partner API (key-based, ~5 req/s) over tenders and tender
      results. Use inside a resold product requires an explicit written
      redistribution right; until that exists this feed is internal-only.
    permitted_paths: ["/api/public/v1/*"]
    rate_limit_per_min: 300
    egress_region: IN
    licence_id: BIDASSIST-INTERNAL-ONLY
    redistribution_allowed: false
    policy_reviewed_at: 2026-10-25
    policy_reviewed_by: compliance-owner
    policy_note: >-
      Records ingested from this source carry redistribution_allowed=false and
      are filtered out of every customer-facing surface by the API layer.
    schedule_cron: null

  - key: tendertiger
    name: TenderTiger (licensed, analyst seats)
    tier: C
    category: licensed
    base_url: https://www.tendertiger.com
    connector: null
    enabled: false
    auth_required: true
    robots_status: unknown
    terms_summary: Seat-licence aggregator. Used by analysts for cross-checking; no programmatic ingestion.
    permitted_paths: []
    rate_limit_per_min: 0
    egress_region: IN
    licence_id: TENDERTIGER-SEAT
    redistribution_allowed: false
    policy_reviewed_at: 2026-10-25
    policy_reviewed_by: compliance-owner
    policy_note: Manual analyst use only. Do not ingest programmatically.
    schedule_cron: null
