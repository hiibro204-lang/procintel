services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: procintel
      POSTGRES_PASSWORD: procintel
      POSTGRES_DB: procintel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procintel -d procintel"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://procintel:procintel@db:5432/procintel
      ARCHIVE_DIR: /data/archive
      # Optional: put OPENROUTER_API_KEY in a .env file next to this compose file
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - archive:/data/archive

volumes:
  pgdata:
  archive:
